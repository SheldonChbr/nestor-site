<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Barrière du navigateur (audit du 23/11/2026) : la page ne peut charger
         que des fichiers du site, et ne peut contacter que le site et les deux
         services d'adresses de l'État (recherche en ligne). Tout autre envoi
         est bloqué par le navigateur. Recopiée dans la page de NESTOR une fois
         le paquet ouvert (lancer), et dans les pages annexes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://geo.api.gouv.fr https://api-adresse.data.gouv.fr; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <!-- Logo publié en clair à côté de cette page (scripts/publier.ps1) : il
         doit être là dès le premier affichage pour les favoris et les onglets. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>NESTOR</title>
    <!--
        Page publique du site NESTOR (dépôt GitHub « nestor-site », publié par
        scripts/publier.ps1). L'application elle-même est dans le paquet chiffré
        (AES-256-CBC + HMAC-SHA256). La clé est dans le lien d'accès, après le
        « # » : cette partie n'est jamais envoyée au serveur. Une fois le paquet
        ouvert, la clé est gardée dans ce navigateur et retirée de la barre
        d'adresse ; les rechargements suivants n'en ont plus besoin.
    -->
    <style>
        :root {
            --fond: #0f172a;
            --texte: #e2e8f0;
            --texte-doux: #94a3b8;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--fond);
            color: var(--texte);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            box-sizing: border-box;
        }
        .boite {
            max-width: 440px;
            text-align: center;
        }
        .boite h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
        }
        .boite p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: var(--texte-doux);
        }

        /* Page ouverte sans clé (validé le 16/11/2026) : fausse barre de
           déchiffrement, puis un berger australien qui dort sur le cadenas, la
           clé dans la gueule. La vraie consigne reste écrite en dessous. */
        .troll[hidden], .dechiffrement[hidden], .chien[hidden] { display: none; }
        .dechiffrement { margin: 8px auto 18px; width: min(320px, 80vw); }
        .dechiffrement p { font-family: Consolas, 'DejaVu Sans Mono', monospace; color: #86efac; min-height: 1.5em; }
        .dechiffrement .fini { color: var(--texte); font-family: inherit; font-size: 18px; font-weight: 700; }
        .barre { height: 10px; margin-top: 8px; border-radius: 5px; background: #1e293b; overflow: hidden; }
        .barre-plein { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #22c55e, #86efac); transition: width 0.8s ease-out; }
        .chien { display: block; width: min(330px, 84vw); height: auto; margin: 0 auto 12px; cursor: pointer; outline: none; animation: chien-arrive 0.6s ease-out; }
        .chien:focus-visible { filter: drop-shadow(0 0 6px #93c5fd); }
        @keyframes chien-arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .boite p.consigne { font-size: 12.5px; }

        /* États du chien */
        .chien .ouvert, .chien .demi, .chien .grogne, .chien .bulle, .chien .sourcils { display: none; }
        .chien.oeil1 .demi { display: inline; }
        .chien.oeil1 .ferme-g { display: none; }
        .chien.reveil .ferme, .chien.reveil .bouche-dort, .chien.reveil .zzz, .chien.oeil1 .zzz { display: none; }
        .chien.reveil .ouvert, .chien.reveil .grogne, .chien.reveil .bulle, .chien.reveil .sourcils { display: inline; }

        /* Il respire en dormant, les « z » montent, la queue s'agite réveillé. */
        .chien .respire { transform-box: fill-box; transform-origin: 50% 100%; animation: respire 3.2s ease-in-out infinite; }
        @keyframes respire { 50% { transform: scale(1.015, 1.035); } }
        .chien.reveil .respire { animation: none; }
        .chien .zzz text { animation: zzz 3s ease-in-out infinite; opacity: 0; }
        .chien .zzz text:nth-child(2) { animation-delay: 0.6s; }
        .chien .zzz text:nth-child(3) { animation-delay: 1.2s; }
        @keyframes zzz { 0% { opacity: 0; transform: translateY(6px); } 30%, 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
        .chien .queue { transform-box: fill-box; transform-origin: 0% 60%; }
        .chien.reveil .queue { animation: queue 0.25s ease-in-out infinite alternate; }
        @keyframes queue { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
        .chien.saute .respire { animation: saute 0.5s ease-out; }
        @keyframes saute { 40% { transform: translateY(-12px); } 100% { transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .chien, .chien .respire, .chien .zzz text, .chien.reveil .queue, .chien.saute .respire { animation: none; }
            .chien .zzz text { opacity: 1; }
            .barre-plein { transition: none; }
        }
    </style>
</head>

    <script>
    (function () {
        'use strict';

        // Site d'essai (dépôt « nestor-essai ») : mis à true par
        // scripts/publier.ps1 -Essai. Sa clé est mémorisée sous un autre nom,
        // et ses données restent à part du vrai NESTOR (isolerStockage).
        var ESSAI = false;
        var CLE_STOCKEE = ESSAI ? 'nestor_essai_cle' : 'nestor_site_cle';
        if (ESSAI) {
            document.title = 'NESTOR (essai)';
            document.querySelector('h1').textContent = 'NESTOR · ESSAI';
        }

        // Hors ligne (sw.js, publié à côté de cette page) : garde en réserve
        // dans le navigateur cette page et le dernier paquet chiffré, pour que
        // NESTOR s'ouvre même sans réseau. Sans effet si le navigateur ne le
        // permet pas (navigation privée, navigateur ancien).
        if ('serviceWorker' in navigator) {
            try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* non permis ici */ }
        }

        function message(texte) {
            document.getElementById('message').textContent = texte;
        }

        function lireStockage() {
            try { return localStorage.getItem(CLE_STOCKEE); } catch (e) { return null; }
        }

        function ecrireStockage(valeur) {
            try {
                if (valeur) localStorage.setItem(CLE_STOCKEE, valeur);
                else localStorage.removeItem(CLE_STOCKEE);
            } catch (e) { /* stockage indisponible : le lien complet restera nécessaire */ }
        }

        function base64urlVersOctets(s) {
            s = s.replace(/-/g, '+').replace(/_/g, '/');
            while (s.length % 4) s += '=';
            var binaire = atob(s);
            var octets = new Uint8Array(binaire.length);
            for (var i = 0; i < binaire.length; i++) octets[i] = binaire.charCodeAt(i);
            return octets;
        }

        // Ouvre le paquet : vérifie l'empreinte (HMAC) puis déchiffre et
        // décompresse. Renvoie null si la clé ne correspond pas.
        async function ouvrirPaquet(donnees, cle) {
            var subtle = window.crypto.subtle;
            var encodeur = new TextEncoder();
            var maitre = await subtle.importKey('raw', base64urlVersOctets(cle), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
            var cleAes = await subtle.importKey('raw', await subtle.sign('HMAC', maitre, encodeur.encode('chiffrement')), { name: 'AES-CBC' }, false, ['decrypt']);
            var cleMac = await subtle.importKey('raw', await subtle.sign('HMAC', maitre, encodeur.encode('authentification')), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);

            var fin = donnees.length - 32;
            var valide = await subtle.verify('HMAC', cleMac, donnees.slice(fin), donnees.slice(0, fin));
            if (!valide) return null;

            var clair = await subtle.decrypt({ name: 'AES-CBC', iv: donnees.slice(0, 16) }, cleAes, donnees.slice(16, fin));
            var flux = new Blob([clair]).stream().pipeThrough(new DecompressionStream('gzip'));
            return JSON.parse(await new Response(flux).text());
        }

        // Reconstitue la page de NESTOR à partir des fichiers du paquet : feuilles
        // de style et scripts insérés tels quels, référentiel fourni d'avance.
        // Les icônes (favicon.svg / .ico) restent des liens vers les fichiers
        // publiés à côté de cette page.
        // Site d'essai : même domaine github.io que le vrai NESTOR, donc même
        // stockage du navigateur. Toutes ses clés sont préfixées : il ne lit ni
        // ne modifie jamais les données, le code ou les réglages du vrai site.
        function isolerStockage() {
            var prefixe = 'nestor-essai:';
            ['localStorage', 'sessionStorage'].forEach(function (nom) {
                var reel;
                try { reel = window[nom]; } catch (e) { return; }
                if (!reel) return;
                var cles = function () {
                    var liste = [];
                    for (var i = 0; i < reel.length; i++) {
                        var k = reel.key(i);
                        if (k && k.indexOf(prefixe) === 0) liste.push(k.slice(prefixe.length));
                    }
                    return liste;
                };
                var isole = {
                    getItem: function (k) { return reel.getItem(prefixe + k); },
                    setItem: function (k, v) { reel.setItem(prefixe + k, String(v)); },
                    removeItem: function (k) { reel.removeItem(prefixe + k); },
                    clear: function () { cles().forEach(function (k) { reel.removeItem(prefixe + k); }); },
                    key: function (i) { var liste = cles(); return i < liste.length ? liste[i] : null; }
                };
                Object.defineProperty(isole, 'length', { get: function () { return cles().length; } });
                Object.defineProperty(window, nom, { value: isole, configurable: true });
            });
            window.__NestorEssai = true;
        }

        function lancer(paquet) {
            if (ESSAI) isolerStockage();
            var fichiers = paquet.fichiers;
            window.__NestorCatalogue = paquet.catalogue;
            // Pages annexes du paquet, ouvertes dans un nouvel onglet par NESTOR
            // (js/etiquettes-dvd.js).
            window.__NestorPages = {};
            Object.keys(fichiers).forEach(function (chemin) {
                if (chemin !== 'index.html' && /\.html$/.test(chemin)) window.__NestorPages[chemin] = fichiers[chemin];
            });
            // La fenêtre est conservée par document.open() : ne pas laisser
            // l'écouteur de la page d'accueil actif dans NESTOR.
            window.removeEventListener('hashchange', surChangementLien);

            // La barrière du navigateur (balise en tête de cette page) est
            // recopiée en tête de NESTOR : elle reste en place quel que soit le
            // navigateur après document.open().
            var barriere = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
            var html = fichiers['index.html']
                .replace(/<head>/i, function (balise) { return barriere ? balise + barriere.outerHTML : balise; })
                .replace(/<link rel="stylesheet" href="([^"]+)">/g, function (balise, chemin) {
                    return '<style>' + fichiers[chemin] + '</style>';
                })
                .replace(/<script src="([^"]+)" defer><\/script>/g, function (balise, chemin) {
                    return '<script>' + fichiers[chemin].replace(/<\/script/gi, '<\\/script') + '<\/script>';
                });

            document.open();
            document.write(html);
            document.close();
        }

        async function demarrer() {
            var dansLien = /(?:^#|&)cle=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
            var cle = dansLien ? dansLien[1] : lireStockage();
            if (!cle) {
                // Sans clé du tout (pas une mauvaise clé) : le petit troll, et
                // la vraie consigne en dessous pour un collègue qui aurait mal
                // copié son lien.
                message("Lien incomplet ? Utilisez le lien d'accès complet qui vous a été transmis.");
                document.getElementById('message').className = 'consigne';
                troll();
                return;
            }
            if (!window.crypto || !window.crypto.subtle || typeof DecompressionStream === 'undefined') {
                message('Navigateur trop ancien : utilisez Edge, Chrome ou Firefox à jour.');
                return;
            }

            var version = await (await fetch('version.json', { cache: 'no-store' })).json();
            var reponse = await fetch(version.paquet);
            if (!reponse.ok) throw new Error('paquet introuvable');
            var donnees = new Uint8Array(await reponse.arrayBuffer());

            var paquet = await ouvrirPaquet(donnees, cle);
            if (!paquet) {
                ecrireStockage(null);
                message("Ce lien n'est plus valable. Demandez le nouveau lien d'accès.");
                return;
            }

            ecrireStockage(cle);
            if (dansLien) history.replaceState(null, '', location.pathname + location.search);
            lancer(paquet);
        }

        /* Le petit troll (validé le 16/11/2026) : fausse barre de
         * déchiffrement qui cale à 99 %, puis le chien de garde. Il entrouvre
         * un œil quand la souris bouge ; un clic le réveille et il répond,
         * une réplique différente à chaque fois. Aucun son, rien d'envoyé. */
        var REPLIQUES = ['Grr… non.', 'Toujours non.', 'C’est ma clé.', 'Je suis un chien, pas une porte.',
            'Insister n’est pas une clé.', 'Ouaf !', 'Bien essayé.', 'Je ne dors que d’un œil.'];

        function troll() {
            var zone = document.getElementById('troll');
            var texte = document.getElementById('dechiffrement-texte');
            var plein = document.getElementById('barre-plein');
            zone.hidden = false;
            var etapes = [
                [12, 'Déchiffrement en cours… 12 %', 700],
                [47, 'Contournement du pare-feu… 47 %', 900],
                [86, 'Presque… 86 %', 900],
                [95, 'Presque… 95 %', 900],
                [99, 'Encore un peu… 99 %', 1400]
            ];
            var i = 0;
            (function suivante() {
                if (i < etapes.length) {
                    plein.style.width = etapes[i][0] + '%';
                    texte.textContent = etapes[i][1];
                    setTimeout(suivante, etapes[i++][2]);
                    return;
                }
                texte.textContent = 'Bien essayé 😏';
                texte.className = 'fini';
                setTimeout(function () {
                    document.getElementById('dechiffrement').hidden = true;
                    reveillerChien();
                }, 1500);
            })();
        }

        function reveillerChien() {
            var chien = document.getElementById('chien');
            var bulle = document.getElementById('bulle-texte');
            var fond = document.getElementById('bulle-fond');
            var n = 0;
            var minuterie = null;
            chien.removeAttribute('hidden');   // élément SVG : pas de propriété « hidden »
            var etat = function (classe) { chien.setAttribute('class', 'chien' + (classe ? ' ' + classe : '')); };
            // La souris bouge : il entrouvre un œil, puis se rendort.
            document.addEventListener('pointermove', function () {
                if (/reveil/.test(chien.getAttribute('class'))) return;
                etat('oeil1');
                clearTimeout(minuterie);
                minuterie = setTimeout(function () { etat(''); }, 1500);
            });
            var repondre = function () {
                var r = REPLIQUES[n++ % REPLIQUES.length];
                bulle.textContent = r;
                etat('reveil' + (r === 'Ouaf !' ? ' saute' : ''));
                var largeur = Math.max(80, Math.ceil(bulle.getComputedTextLength()) + 30);
                fond.setAttribute('width', largeur);
                fond.setAttribute('x', 140 - largeur / 2);
                clearTimeout(minuterie);
                minuterie = setTimeout(function () { etat(''); }, 2600);
            };
            chien.addEventListener('click', repondre);
            chien.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); repondre(); }
            });
        }

        // Lien collé dans un onglet déjà ouvert sur cette page : seule la
        // partie après « # » change, sans rechargement. On repart de zéro.
        function surChangementLien() { location.reload(); }
        window.addEventListener('hashchange', surChangementLien);

        demarrer().catch(function (erreur) {
            message('Impossible de charger NESTOR (' + erreur.message + '). Vérifiez la connexion puis rechargez la page.');
        });
    })();
    </script>
